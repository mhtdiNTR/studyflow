<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Log in – StudyFlow</title>
</head>
<body class="auth-page" data-page="login">
  <main class="auth-wrap">
    <section class="auth-intro">
      <h1>Study<span class="mark">Flow</span></h1>
      <p>Put every deadline in one place and see what needs you today.</p>
    </section>
    <section class="auth-card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="login" aria-selected="true">Log in</button>
        <button type="button" role="tab" data-tab="register" aria-selected="false">Create account</button>
      </div>
      <ul class="errors" id="errors" role="alert" hidden></ul>

      <form id="form-login" class="auth-form" novalidate>
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn">Log in</button>
      </form>

      <form id="form-register" class="auth-form" novalidate hidden>
        <label>Name <input type="text" name="name" autocomplete="name" required></label>
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" required></label>
        <button type="submit" class="btn">Create account</button>
      </form>
      <p class="note">Demo version: accounts and tasks are saved in this browser only.</p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
