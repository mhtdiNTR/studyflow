<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Contact us – StudyFlow</title>
</head>
<body data-page="contact">
  <header class="topbar">
    <a class="brand" href="index.html">Study<span class="mark">Flow</span></a>
    <nav>
      <a href="index.html" >My tasks</a>
      <a href="contact.html" aria-current="page">Contact us</a>
      <a href="login.html" id="logout">Log out</a>
    </nav>
  </header>
  <main class="dash">
    <h1>Contact us</h1>
    <p class="lead">Found a bug or have an idea for StudyFlow? Send it here and we'll read it.</p>
    <p class="success" id="success" role="status" hidden>Message sent. Thanks for getting in touch.</p>
    <ul class="errors" id="errors" role="alert" hidden></ul>
    <form id="contact-form" class="panel task-form" novalidate>
      <label>Name <input type="text" id="c-name" maxlength="100" required></label>
      <label>Email <input type="email" id="c-email" required></label>
      <label class="wide">Message
        <textarea id="c-message" rows="6" maxlength="1000" required></textarea>
      </label>
      <p class="counter wide" id="counter" aria-live="polite">0 / 1000</p>
      <div class="actions"><button type="submit" class="btn">Send message</button></div>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
