<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>My tasks – StudyFlow</title>
</head>
<body data-page="dashboard">
  <header class="topbar">
    <a class="brand" href="index.html">Study<span class="mark">Flow</span></a>
    <nav>
      <a href="index.html" aria-current="page">My tasks</a>
      <a href="contact.html" >Contact us</a>
      <a href="login.html" id="logout">Log out</a>
    </nav>
  </header>
  <main class="dash">
    <h1 id="greeting">Hi</h1>
    <section class="progress" aria-label="Progress">
      <p id="progress-text">0 of 0 tasks done</p>
      <div class="bar"><div id="progress-fill"></div></div>
    </section>

    <section class="panel">
      <h2 id="form-title">Add a task</h2>
      <form id="task-form" class="task-form" novalidate>
        <input type="hidden" id="t-id">
        <label class="wide">Title <input type="text" id="t-title" maxlength="150" required></label>
        <label class="wide">Notes <input type="text" id="t-desc"></label>
        <label>Due date <input type="date" id="t-due"></label>
        <label>Priority
          <select id="t-prio">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit" class="btn" id="form-submit">Add task</button>
          <button type="button" class="btn ghost" id="form-cancel" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="toolbar">
      <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
      <select id="filter-status" aria-label="Filter by status">
        <option value="all">All tasks</option>
        <option value="pending">Pending</option>
        <option value="done">Done</option>
      </select>
      <select id="filter-priority" aria-label="Filter by priority">
        <option value="all">Any priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </section>

    <ul class="tasks" id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks match. Add one above or change the filters.</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
